[theme]
base = "light"
primaryColor = "#2D6A55"
backgroundColor = "#F4F5F0"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#202D28"
linkColor = "#2D6A55"
borderColor = "#B9C6BC"
dataframeBorderColor = "#D9E1D9"
dataframeHeaderBackgroundColor = "#EEF1EC"
dataframeHeaderTextColor = "#202D28"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "'Source Sans 3':https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap"
headingFontWeights = [700, 600, 600]
metricValueFontWeight = 600
greenColor = "#2D6A55"
blueColor = "#2E5F8A"
yellowTextColor = "#8A5A16"
yellowBackgroundColor = "#FFF4DC"
redTextColor = "#A13D38"
redBackgroundColor = "#FCEDEA"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F0"
borderColor = "#B9C6BC"

[server]
headless = true
